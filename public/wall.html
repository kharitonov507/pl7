<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player Control — 100 экранов</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/wall.css"></head><body>
<header class="wall-header"><div><h1>Сеть из 100 экранов<span class="heading-dot">.</span></h1><p id="summary">Загрузка парка…</p></div><nav><a class="button" href="/?agents=go">Живые плееры</a><a class="button" href="/fleet.html">Реестр и настройки</a><a class="button" href="/catalog.html">Player Library</a><button class="button" id="fullscreen">На весь экран</button></nav></header>
